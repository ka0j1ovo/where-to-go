<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市对比 · 旅·问</title>
  <link rel="stylesheet" href="style.css?v=v17">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="index.html">旅<span class="brand-dot">·</span>问<span class="brand-sub">where-to-go</span></a>
    <div class="navlinks">
      <a class="navlink" href="index.html">首页</a>
      <a class="navlink" href="test.html">天选之城测试</a>
      <a class="navlink" href="recommender.html">旅游城市推荐器</a>
      <a class="navlink active" href="compare.html">城市对比</a>
    </div>
  </nav>

  <main class="compare-main">
    <h1 class="compare-title">城市对比</h1>

    <!-- 选城区：水平居中、足够宽 -->
    <section class="compare-selectors">
      <div class="compare-pick">
        <label for="cmp-a-input">城市 A</label>
        <div class="compare-search-box">
          <input id="cmp-a-input" class="compare-search" type="text" autocomplete="off"
                 placeholder="输入城市 / 省份 / 标签">
          <div id="cmp-a-results" class="search-results"></div>
        </div>
        <div id="cmp-a-chosen" class="compare-chosen"></div>
      </div>

      <div class="compare-vs">VS</div>

      <div class="compare-pick">
        <label for="cmp-b-input">城市 B</label>
        <div class="compare-search-box">
          <input id="cmp-b-input" class="compare-search" type="text" autocomplete="off"
                 placeholder="输入城市 / 省份 / 标签">
          <div id="cmp-b-results" class="search-results"></div>
        </div>
        <div id="cmp-b-chosen" class="compare-chosen"></div>
      </div>
    </section>

    <!-- 雷达图 + 对比表：并列 -->
    <section class="compare-panels">
      <div class="compare-radar-card">
        <div id="compare-radar" class="compare-radar"></div>
      </div>
      <div class="compare-table-card">
        <div class="compare-table" id="compare-table"></div>
      </div>
    </section>

    <!-- 城市名片：左右铺满并列 -->
    <section class="compare-cards" id="compare-cards"></section>
  </main>

  <script src="data.js?v=v17"></script>
  <script src="echarts.min.js"></script>
  <script src="common.js?v=v17"></script>
  <script src="compare.js?v=v17"></script>
</body>
</html>
